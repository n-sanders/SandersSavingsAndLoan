<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sanders Savings and Loan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <script src="/js/themes.js"></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <h1 class="brand">Sanders Savings &amp; Loan</h1>
      <p class="brand-sub">Family savings for chores, reading, and rainy days.</p>
      <div id="error" class="error hidden"></div>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="passphrase">Passphrase</label>
        <input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required />
        <button class="btn" type="submit" style="width:100%">Sign in</button>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
